
name: Build Android APK

on:
  push:
    branches: ["**"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: platform-tools

      - name: Install Android build tools
        run: |
          sdkmanager "platforms;android-35" \
            "build-tools;35.0.0" \
            "cmake;3.22.1" \
            "ndk;27.0.12077973"

      - name: Make Gradle executable
        run: |
          sed -i 's/\r$//' ./gradlew
          chmod +x ./gradlew

      - name: Build release APK
        run: ./gradlew --no-daemon --no-build-cache --refresh-dependencies clean assembleRelease --stacktrace

      - name: Collect resource diagnostics
        if: always()
        shell: bash
        run: |
          mkdir -p diagnostics

          echo "=== Build information ===" > diagnostics/report.txt
          java -version 2>> diagnostics/report.txt
          ./gradlew --version >> diagnostics/report.txt 2>&1 || true

          echo "=== Source resource files ===" >> diagnostics/report.txt
          find app/src -type f \( -name "*.xml" -o -name "*.arsc" \) >> diagnostics/report.txt

          echo "=== Merged resource files ===" >> diagnostics/report.txt
          find app/build/intermediates/incremental/release/mergeReleaseResources -type f -name "*.xml" >> diagnostics/report.txt 2>&1 || true

          echo "=== Unicode escape occurrences ===" >> diagnostics/report.txt
          grep -RniF '\u' app/src/main/res --include="*.xml" >> diagnostics/report.txt 2>&1 || true

          echo "=== more_details occurrences ===" >> diagnostics/report.txt
          grep -Rni -C 5 "more_details" app/src/main/res >> diagnostics/report.txt 2>&1 || true

          if [ -d app/build/intermediates/incremental/release/mergeReleaseResources ]; then
            mkdir -p diagnostics/merged-resources
            cp -R app/build/intermediates/incremental/release/mergeReleaseResources/. diagnostics/merged-resources/ || true
          fi

          if [ -d app/build/outputs/logs ]; then
            cp -R app/build/outputs/logs diagnostics/build-logs || true
          fi

          zip -qr resource-diagnostics.zip diagnostics

      - name: Upload resource diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: IRANGTA-Resource-Diagnostics
          path: resource-diagnostics.zip
          if-no-files-found: warn

      - name: Verify APK signature
        if: success()
        run: |
          $ANDROID_HOME/build-tools/35.0.0/apksigner verify --verbose app/build/outputs/apk/release/nativo_sampmobile.apk

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: IRANGTA-Client
          path: app/build/outputs/apk/release/nativo_sampmobile.apk
          if-no-files-found: error
