
name: Build Android APK

on:
  push:
    branches: ["**"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: platform-tools

      - name: Install Android build tools
        run: |
          sdkmanager "platforms;android-35" \
            "build-tools;35.0.0" \
            "cmake;3.22.1" \
            "ndk;27.0.12077973"

      - name: Make Gradle executable
        run: |
          sed -i 's/\r$//' ./gradlew
          chmod +x ./gradlew

      - name: Build release APK
        run: ./gradlew --no-daemon --no-build-cache --refresh-dependencies clean assembleRelease --stacktrace

      - name: Diagnose resource compilation failure
        if: failure()
        shell: bash
        run: |
          echo "=== merged resource files ==="
          find app/build/intermediates/incremental/release/mergeReleaseResources -type f -name "*.xml" -print 2>/dev/null || true
          echo "=== merged values.xml ==="
          find app/build/intermediates/incremental/release/mergeReleaseResources -type f -name "values.xml" -exec sh -c 'echo "FILE: $1"; cat "$1"' _ {} \; 2>/dev/null || true
          echo "=== more_details occurrences ==="
          grep -Rni -C 5 "more_details" app/build/intermediates/incremental/release/mergeReleaseResources 2>/dev/null || true
          echo "=== unicode escape occurrences ==="
          grep -RniF '\u' app/build/intermediates/incremental/release/mergeReleaseResources 2>/dev/null || true

      - name: Verify APK signature
        run: |
          $ANDROID_HOME/build-tools/35.0.0/apksigner verify --verbose app/build/outputs/apk/release/nativo_sampmobile.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: IRANGTA-Client
          path: app/build/outputs/apk/release/nativo_sampmobile.apk
          if-no-files-found: error
